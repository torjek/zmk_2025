include:
  # 1. Standard (Macros enabled by default)
  - board: monogreen
    shield: v4_2_hu_left
    artifact-name: v4_2_hu_macro_left_firmware

  - board: monogreen
    shield: v4_2_da_left
    artifact-name: v4_2_da_macro_left_firmware

  # 2. Simple Mode (Numbers instead of Macros)
  - board: monogreen
    shield: v4_2_hu_simple_left
    artifact-name: v4_2_hu_simple_left_firmware

  - board: monogreen
    shield: v4_2_da_simple_left
    artifact-name: v4_2_da_simple_left_firmware

  # 3. Settings Reset (Wipes Bluetooth memory)
  - board: monogreen
    shield: settings_reset
    artifact-name: settings_reset_firmware

  # 4. lpos spike (branch lpos-spike only): the Hungarian firmware with ZMK Studio over USB, unlocked,
  #    to test that a key changed live in Studio is also sent by the "&lpos" combos.
  - board: monogreen
    shield: v4_2_hu_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: v4_2_hu_lpos_studio_left_firmware
